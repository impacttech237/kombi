name = "kombi-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Base de données D1 (SQLite). Créer avec :
#   wrangler d1 create kombi-db
# puis coller le database_id retourné ci-dessous.
[[d1_databases]]
binding = "DB"
database_name = "kombi-db"
database_id = "90670ac1-78dc-4898-9a47-9db0143645b7"
migrations_dir = "migrations"

# Stockage R2 pour les PDF de factures et justificatifs.
[[r2_buckets]]
binding = "DOCS"
bucket_name = "kombi-documents"

# 1 base par entreprise : Durable Object avec SQLite embarqué (D13).
[[durable_objects.bindings]]
name = "ENTREPRISE"
class_name = "EntrepriseDO"

[[durable_objects.bindings]]
name = "KOMBI_AGENT"
class_name = "KombiAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["EntrepriseDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["KombiAgent"]

# Workers AI — cerveau des agents IA.
[ai]
binding = "AI"

[vars]
# Modèle LLM pour l'agent IA. Changer ici pour upgrader (ex: @cf/meta/llama-3.3-70b-instruct-fp8-fast).
AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"

# La PWA (front) est servie par le même Worker → même origine que l'API.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[observability]
enabled = true

# Sauvegarde quotidienne de toutes les entreprises vers R2 (voir services/sauvegarde.ts et
# docs/AUDIT_2026-09-03.md point 1 : les Durable Objects n'ont pas de réplique Cloudflare native).
# 02:00 UTC ≈ 03:00/04:00 Afrique de l'Ouest/Centrale selon la saison — creux d'activité attendu.
[triggers]
crons = ["0 2 * * *"]
