name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      # Requis avant les tests : le pool vitest-workers lit wrangler.toml ([assets] -> ../web/dist).
      - name: Build de la PWA
        run: pnpm --filter @kombi/web build

      - name: Tests
        run: pnpm -r test

